services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: indherco
      POSTGRES_USER: indherco_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indherco_local_change_me}
      TZ: America/Santiago
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indherco_app -d indherco"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      TZ: America/Santiago
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: postgresql://indherco_app:${POSTGRES_PASSWORD:-indherco_local_change_me}@postgres:5432/indherco
      DB_USERNAME: indherco_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:-indherco_local_change_me}
      JWT_SECRET: ${JWT_SECRET:-indherco-local-jwt-secret-change-me-at-least-32-chars}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      JAVA_OPTS: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
