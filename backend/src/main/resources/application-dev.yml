spring:
app:
  security:
    jwt-secret: ${JWT_SECRET:indherco-dev-secret-key-change-this-value-32chars}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
  login:
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
